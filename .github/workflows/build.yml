name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build app
        shell: cmd
        run: build.bat

      - name: Upload unsigned build
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: BetterGlorious-unsigned
          path: bin/
          if-no-files-found: error

      # Signing runs for tags once the SignPath project is set up (see docs/RELEASING.md).
      - name: Sign with SignPath
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'betterglorious' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $src = if (Test-Path signed) { 'signed\*' } else { 'bin\*' }
          $zip = "BetterGlorious-$tag-win-x64.zip"
          Compress-Archive -Path $src -DestinationPath $zip
          $signed = if (Test-Path signed) { 'Signed with a SignPath Foundation certificate.' } else { 'This build is not code-signed yet: Windows SmartScreen may warn, and Smart App Control may block it.' }
          $notes = @"
          ## Install
          1. Download **$zip** below and extract it anywhere (for example ``Documents\BetterGlorious``).
          2. Run ``BetterGlorious.exe``. Keep the other files next to it: the WebView2 DLLs and the ``ui`` folder are part of the app.
          3. Close Glorious CORE first so both apps don't talk to the mouse at once.

          $signed

          Free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org).
          "@
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag $zip --clobber }
          else { gh release create $tag $zip --title "BetterGlorious $tag" --notes "$notes" --generate-notes }
